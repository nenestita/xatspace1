<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xatspace de Tita</title>
    <!-- Importation des polices d'écriture Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Parisienne&family=Sacramento&display=swap" rel="stylesheet">
    
    <style>
        /* DESIGN GLOBAL */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #fff;
        }

        a {
            color: #cc66ff;
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: #ff6699;
        }

        /* 1. PAGE D'ACCUEIL (SPLASH) */
        #splash-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://u.cubeupload.com/Tita/FromKlickpincomPract.gif') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .btn-entrer {
            padding: 20px 60px;
            font-family: 'Sacramento', cursive;
            font-size: 55px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://u.cubeupload.com/Tita/1dc43cedb3014390281b.jpg') no-repeat center center;
            background-size: cover;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px #fff;
            transition: all 0.3s ease;
        }
        .btn-entrer:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 102, 153, 0.8);
            border-color: #ff6699;
        }

        /* 2. LE PROFIL PRINCIPAL */
        #main-profile {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://u.cubeupload.com/Tita/FromKlickpincomDisco.gif') no-repeat center center fixed;
            background-size: cover;
            display: none;
            opacity: 0;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        /* BLOC AVATAR + ID (HAUT GAUCHE) */
        .tita-profile-box {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
        }

        .tita-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff6699;
            box-shadow: 0 0 20px rgba(255, 102, 153, 0.7);
        }

        .tita-status {
            position: absolute;
            bottom: 2px;
            right: 4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        .tita-id {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        
        }

        /* BLOC DE PRÉSENTATION TRANSPARENT VIOLET */
        .presentation-box {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 380px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(204, 102, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            color: #cc66ff;
        }

        .presentation-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .presentation-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            font-size: 15px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(204, 102, 255, 0.15);
        }

        .presentation-item:last-child {
            border-bottom: none;
        }

        .icon-bullet {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .twitch-color {
            color: #a370f7;
            font-weight: bold;
        }

        /* COMPOSANT MENU DÉROULANT MARIAGE ("LOVE") */
        .dropdown-marriage {
            position: absolute;
            top: 40px;
            right: 40px;
            display: inline-block;
        }

        .btn-love {
            padding: 12px 35px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ff6699;
            border-radius: 25px;
            box-shadow: 0 0 15px #ff6699, inset 0 0 10px #ff6699;
            color: #fff;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff6699;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .marriage-content {
            display: none;
            position: absolute;
            right: 0;
            top: 55px;
            background: rgba(15, 15, 15, 0.95);
            min-width: 240px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 102, 153, 0.3);
            border-radius: 16px;
            padding: 15px;
            z-index: 50;
            align-items: center;
            gap: 15px;
        }

        .dropdown-marriage:hover .marriage-content {
            display: flex;
        }

        .raven-avatar-container {
            position: relative;
            width: 55px;
            height: 55px;
        }

        .raven-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff6699;
            box-shadow: 0 0 8px rgba(255, 102, 153, 0.5);
        }

        .raven-link {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }
        .raven-link:hover .raven-name {
            color: #ff6699;
        }

        .raven-name {
            font-size: 18px;
            font-weight: bold;
            transition: color 0.2s;
        }

        .heart-pink {
            color: #ff3380;
            font-size: 18px;
            animation: heartBeat 1.2s infinite;
            margin-left: auto;
        }

        /* ETATS ONLINE/OFFLINE */
        .online { background-color: #00FF00; box-shadow: 0 0 10px #00FF00; }
        .offline { background-color: #FF0000; box-shadow: 0 0 10px #FF0000; }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        .lecteur-cache {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
            top: -9999px;
            left: -9999px;
        }
    </style>
</head>
<body>

    <!-- ==================== ÉTAPE 1 : PAGE D'ACCUEIL ==================== -->
    <div id="splash-page">
        <button id="bouton-declencheur" class="btn-entrer">Tita</button>
    </div>

    <!-- ==================== ÉTAPE 2 : LE PROFIL PRINCIPAL ==================== -->
    <div id="main-profile">
        
        <!-- BLOC AVATAR + ID -->
        <div class="tita-profile-box">
            <div class="avatar-container">
                <img class="tita-avatar" src="https://u.cubeupload.com/Tita/e01fcc986e9346fc74db.jpg" alt="Tita">
                <span class="tita-status online"></span>
            </div>
            <div class="tita-id">1133435149</div>
        </div>

        <h1 class="tita-giant-title">Tita</h1>

        <!-- BLOC DE PRÉSENTATION VIOLET -->
        <div class="presentation-box">
            <ul class="presentation-list">
               <li class="presentation-item">
                    <span class="icon-bullet">✨</span>
                    <span><strong>Name :</strong> Tita</span>
                </li>
                <li class="presentation-item">
                    <span class="icon-bullet">✉️</span>
                    <span><strong>Contact :</strong> <a href="https://forum.xat.com/profile/55475/" target="_blank">Forum</a></span>
                </li>
                <li class="presentation-item">
                    <span class="icon-bullet">💬</span>
                    <span><strong>My chat :</strong> <a href="https://xat.com/Blog" target="_blank">Talk on xat</a></span>
                </li>
                <li class="presentation-item">
                    <span class="icon-bullet">🔮</span>
                    <span><strong>Twitch :</strong> <a href="https://twitch.tv/nenestita" target="_blank" class="twitch-color">nenestita</a></span>
                </li>
            </ul>
        </div>

        <!-- WIDGET MARIAGE "LOVE" EN MENU DÉROULANT (VERS RAVEN) -->
        <div class="dropdown-marriage">
            <button class="btn-love">LOVE ▲</button>
            <div class="marriage-content">
                <a href="https://xat.me/Raven" target="_blank" class="raven-link">
                    <div class="raven-avatar-container">
                        <img class="raven-avatar" src="https://i.ibb.co/C31SKGg3/MTH0h-Wzfrii-X.jpg" alt="Raven">
                        <span class="tita-status offline" id="raven-status"></span>
                    </div>
                    <div class="raven-name">Raven</div>
                </a>
                <span class="heart-pink">❤</span>
            </div>
        </div>

        <!-- CONTENEUR DU LECTEUR DE MUSIQUE INVISIBLE -->
        <div class="lecteur-cache" id="musique-container"></div>
    </div>

    <!-- LOGIQUE DYNAMIQUE DE CLIC INSTANTANÉ -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var bouton = document.getElementById('bouton-declencheur');
            
            if(bouton) {
                bouton.addEventListener("click", function() {
                    var splash = document.getElementById('splash-page');
                    var profil = document.getElementById('main-profile');
                    var musique = document.getElementById('musique-container');

                    // Effacement immédiat de l'écran d'accueil
                    splash.style.opacity = '0';
                    
                    setTimeout(function() {
                        splash.style.display = 'none';
                        profil.style.display = 'block';
                        
                        setTimeout(function() { 
                            profil.style.opacity = '1'; 
                        }, 50);

                        // Injection automatique sécurisée de la musique YouTube
                        var idVideo = "dQw4w9WgXcQ"; 
                        musique.innerHTML = '<iframe src="https://youtube.com' + idVideo + '?autoplay=1&loop=1&playlist=' + idVideo + '&mute=0" allow="autoplay" style="border:none;"></iframe>';
                    }, 400);
                });
            }
        });
    </script>

</body>
</html>
