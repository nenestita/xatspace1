<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xatspace de Tita</title>
    <!-- Importation propre et sécurisée des polices d'écriture Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        /* CONFIGURATION STRUCTURELLE DE BASE */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
            color: #fff;
        }

        a {
            color: #ff6699;
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: #cc66ff;
        }

        /* 1. LA PAGE D'ACCUEIL (SPLASH PAGE) */
        #splash-page {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://u.cubeupload.com/Tita/FromKlickpincomPract.gif') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* LE BOUTON CENTRAL INCRUSTÉ AVEC L'IMAGE EN ARRIÈRE-PLAN */
        .btn-entrer {
            padding: 20px 60px;
            font-family: 'Sacramento', cursive;
            font-size: 55px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://u.cubeupload.com/Tita/1dc43cedb3014390281b.jpg') no-repeat center center;
            background-size: cover;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(0, 0, 0, 0.6);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px #fff;
            transition: all 0.3s ease;
        }
        
        .btn-entrer:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 102, 153, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.4);
            border-color: #ff6699;
        }

        /* 2. ÉCRAN DE TRANSITION D'ACCUEIL (PAILLETTES DURANT 4 SECONDES) */
        #transition-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #050505;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #transition-screen::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://giphy.com') center center;
            background-size: cover;
            opacity: 0.15;
            pointer-events: none;
        }

        .phrase-deen {
            font-family: 'Cinzel', serif;
            font-style: italic;
            font-size: 34px;
            letter-spacing: 4px;
            color: #f1dfbc;
            text-shadow: 0 0 15px rgba(241, 223, 188, 0.6);
            text-align: center;
            z-index: 25;
        }

        /* 3. LE PROFIL PRINCIPAL (AFFICHÉ APRÈS LE CLIC) */
        #main-profile {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://u.cubeupload.com/Tita/FromKlickpincomDisco.gif') no-repeat center center fixed;
            background-size: cover;
            display: none;
            opacity: 0;
            z-index: 10;
            transition: opacity 0.8s ease;
        }

        /* COMPOSANT AVATAR ROND DE TITA + STATUT EN LIGNE (HAUT GAUCHE) */
        .tita-profile-box {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
        }

        .tita-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff6699;
            box-shadow: 0 0 20px rgba(255, 102, 153, 0.7);
        }

        .tita-status {
            position: absolute;
            bottom: 2px;
            right: 4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #000;
        }

        .tita-id {
            font-size: 13px;
            color: rgba(255,255,255,0.75);
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        /* STYLE NOM GEANT EN BAS GAUCHE EN MODE NAMEGRAD VIOLET ET ROSE */
        .tita-giant-title {
            position: absolute;
            bottom: 30px;
            left: 50px;
            font-family: 'Parisienne', cursive;
            font-size: 110px;
            font-weight: 500;
            background: linear-gradient(45deg, #cc66ff, #ff6699);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 0px 15px rgba(204, 102, 255, 0.6));
            margin: 0;
            user-select: none;
        }

        /* BLOC DE PRÉSENTATION TRANSPARENT AESTHETIC (BAS DROITE) */
        .presentation-box {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 380px;
            background: rgba(10, 10, 10, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 102, 153, 0.25);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255,255,255,0.05);
            box-sizing: border-box;
        }

        .presentation-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .presentation-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 0;
            font-size: 15px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .presentation-item:last-child {
            border-bottom: none;
        }

        .icon-bullet {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .twitch-color {
            color: #a370f7;
            font-weight: bold;
        }

        /* WIDGET MARIAGE "LOVE" EN MENU DÉROULANT (HAUT DROITE) */
        .dropdown-marriage {
            position: absolute;
            top: 40px;
            right: 40px;
            display: inline-block;
        }

        .btn-love {
            padding: 12px 35px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #ff6699;
            border-radius: 25px;
            box-shadow: 0 0 15px #ff6699, inset 0 0 10px #ff6699;
            color: #fff;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff6699;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .marriage-content {
            display: none;
            position: absolute;
            right: 0;
            top: 55px;
            background: rgba(15, 15, 15, 0.95);
            min-width: 240px;
            box-shadow: 0px 8px 25px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 102, 153, 0.3);
            border-radius: 16px;
            padding: 15px;
            z-index: 50;
            align-items: center;
            gap: 15px;
        }

        .dropdown-marriage:hover .marriage-content {
            display: flex;
        }

        .raven-avatar-container {
            position: relative;
            width: 55px;
            height: 55px;
        }

        .raven-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff6699;
        }

        .raven-name {
            font-size: 18px;
            font-weight: bold;
        }

        .heart-pink {
            color: #ff3380;
            font-size: 18px;
            animation: heartBeat 1.2s infinite;
            margin-left: auto;
        }

        /* CLASSIFICATION DES VOYANTS LUMINEUX */
        .online { background-color: #00FF00; box-shadow: 0 0 10px #00FF00; }
        .offline { background-color: #FF0000; box-shadow: 0 0 10px #FF0000; }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }

        /* LECTEUR DE MUSIQUE INVISIBLE SURÉLEVÉ */
        .lecteur-cache {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
            top: -9999px;
            left: -9999px;
        }
    </style>
</head>
<body>

    <!-- ==================== ÉTAPE 1 : PAGE D'ACCUEIL ==================== -->
    <div id="splash-page">
        <button class="btn-entrer" onclick="ouvrirProfil()">Tita</button>
    </div>
 <!-- ==================== ÉTAPE 2 : TRANSITION PAILLETTES (4 SECONDES) ==================== -->
    <div id="transition-screen">
        <div class="phrase-deen">deen over dunya</div>
    </div>

    <!-- ==================== ÉTAPE 3 : LE PROFIL PRINCIPAL ==================== -->
    <div id="main-profile">
        
        <!-- BLOC AVATAR + ID DE TITA -->
        <div class="tita-profile-box">
            <div class="avatar-container">
                <img class="tita-avatar" src="https://cubeupload.com" alt="Tita">
                <span class="tita-status online"></span>
            </div>
            <div class="tita-id">1133435149</div>
        </div>

        <!-- NOM GÉANT EN BAS GAUCHE EN DÉGRADÉ VIOLET/ROSE -->
        <h1 class="tita-giant-title">Tita</h1>

        <!-- BLOC DE PRÉSENTATION TRANSPARENT ET ESTHÉTIQUE -->
        <div class="presentation-box">
            <ul class="presentation-list">
                <li class="presentation-item">
                    <span class="icon-bullet">✨</span>
                    <span><strong>Nom :</strong> Tita</span>
                </li>
                <li class="presentation-item">
                    <span class="icon-bullet">✉️</span>
                    <span><strong>Contact :</strong> <a href="https://xat.com" target="_blank">Mon Profil Forum</a></span>
                </li>
                <li class="presentation-item">
                    <span class="icon-bullet">💬</span>
                    <span><strong>Mes Tchats :</strong> <a href="https://xat.com" target="_blank">Discuter sur xat</a></span>
                </li>
                <li class="presentation-item">
                    <span class="icon-bullet">🔮</span>
                    <span><strong>Twitch :</strong> <a href="https://twitch.tv" target="_blank" class="twitch-color">nenestita</a></span>
                </li>
            </ul>
        </div>

        <!-- WIDGET MARIAGE "LOVE" EN MENU DÉROULANT (VERS RAVEN) -->
        <div class="dropdown-marriage">
            <button class="btn-love">LOVE ▲</button>
            <div class="marriage-content">
                <div class="raven-avatar-container">
                    <a href="https://xat.me" target="_blank">
                        <img class="raven-avatar" src="https://xat.me" id="raven-img" alt="Raven">
                    </a>
                    <span class="tita-status offline" id="raven-status"></span>
                </div>
                <div class="raven-name">Raven</div>
                <span class="heart-pink">❤</span>
            </div>
        </div>

        <!-- CONTENEUR DU LECTEUR DE MUSIQUE INVISIBLE -->
        <div class="lecteur-cache" id="musique-container"></div>
        
    </div>

    <!-- ==================== LOGIQUE DYNAMIQUE JAVASCRIPT ==================== -->
    <script>
        function ouvrirProfil() {
            var splash = document.getElementById('splash-page');
            var transitionScreen = document.getElementById('transition-screen');
            var profil = document.getElementById('main-profile');
            var musique = document.getElementById('musique-container');

            // 1. Disparition fluide de l'accueil
            splash.style.opacity = '0';
            
            setTimeout(function() {
                splash.style.display = 'none';
                
                // 2. Affichage immédiat de l'écran de transition avec paillettes
                transitionScreen.style.display = 'flex';
                setTimeout(function() {
                    transitionScreen.style.opacity = '1';
                }, 50);

                // 3. Blocage de 4 secondes complètes (4000ms) pour lire la phrase
                setTimeout(function() {
                    transitionScreen.style.opacity = '0';
                    
                    setTimeout(function() {
                        transitionScreen.style.display = 'none';
                        
                        // 4. Révélation de l'interface complète du profil
                        profil.style.display = 'block';
                        setTimeout(function() {
                            profil.style.opacity = '1';
                        }, 50);

                        // 5. Injection automatique de la musique Youtube invisible
                        var idVideo = "dQw4w9WgXcQ"; 
                        musique.innerHTML = '<iframe src="https://youtube.com' + idVideo + '?autoplay=1&loop=1&playlist=' + idVideo + '&mute=0" allow="autoplay" style="border:none;"></iframe>';
                    }, 600);

                }, 4000);

            }, 600);
        }
    </script>

</body>
</html>
